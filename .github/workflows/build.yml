name: Build VSTO Add-in and MSI Installer

"on":
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Ensure WiX Toolset v3.11
        run: |
          $wixBin86 = "C:\Program Files (x86)\WiX Toolset v3.11\bin"
          $wixBin64 = "C:\Program Files\WiX Toolset v3.11\bin"
          if (-not (Test-Path (Join-Path $wixBin86 "candle.exe")) -and -not (Test-Path (Join-Path $wixBin64 "candle.exe"))) {
            choco install wixtoolset --version=3.11.2 -y --no-progress
          }
        shell: pwsh

      - name: Import Code Signing Certificate
        run: certutil -user -p "" -importpfx "PhishingReporterAddIn\PhishingReporterAddIn_TemporaryKey.pfx" NoRoot
        shell: cmd

      - name: Resolve Manifest Thumbprint
        id: cert
        run: |
          $certPath = Join-Path $env:GITHUB_WORKSPACE "PhishingReporterAddIn\PhishingReporterAddIn_TemporaryKey.pfx"
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($certPath, "")
          "thumbprint=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        shell: pwsh

      - name: Build Outlook Add-In (Release Configuration)
        run: msbuild PhishingReporterAddIn/PhishingReporterAddIn.csproj /p:Configuration=Release /p:ManifestCertificateThumbprint=${{ steps.cert.outputs.thumbprint }}

      - name: Compile and Link WiX Installer (MSI)
        run: |
          cd Setup
          $wixCandidates = @(
            "C:\Program Files (x86)\WiX Toolset v3.11\bin",
            "C:\Program Files\WiX Toolset v3.11\bin",
            "$env:ChocolateyInstall\lib\wixtoolset\tools",
            "$env:ChocolateyInstall\bin"
          )
          $wixBin = $wixCandidates | Where-Object {
            (Test-Path (Join-Path $_ "candle.exe")) -and (Test-Path (Join-Path $_ "light.exe"))
          } | Select-Object -First 1
          if (-not $wixBin) {
            $roots = @("C:\Program Files", "C:\Program Files (x86)", "$env:ChocolateyInstall") | Where-Object { Test-Path $_ }
            $found = Get-ChildItem $roots -Filter candle.exe -File -Recurse -ErrorAction SilentlyContinue | Where-Object {
              Test-Path (Join-Path $_.DirectoryName "light.exe")
            } | Select-Object -First 1
            if ($found) { $wixBin = $found.DirectoryName }
          }
          if (-not $wixBin) {
            throw "WiX Toolset not found (candle.exe missing)."
          }
          Write-Host "Using WiX bin: $wixBin"
          & (Join-Path $wixBin "candle.exe") -arch x64 Setup.wxs -o Setup.wixobj
          & (Join-Path $wixBin "light.exe") -ext WixUIExtension Setup.wixobj -out PhishingReporterSetup.msi
          if (-not (Test-Path "PhishingReporterSetup.msi")) {
            throw "MSI was not generated."
          }
        shell: pwsh

      - name: Upload MSI Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhishingReporterSetup
          path: Setup/PhishingReporterSetup.msi
